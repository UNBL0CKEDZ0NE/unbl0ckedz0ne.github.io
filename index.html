  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

<body>
  <iframe id="fm" src="about:blank"></iframe>
  <script>
    (async () => {
      try {
        const url = 'https://cdn.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3/assets/index.html?t=' + Date.now();
        const res = await fetch(url);
        const text = await res.text();
        const frame = document.getElementById('fm');
        
        // Directly inject the text into the iframe via srcdoc to render inline
        frame.srcdoc = text;
      } catch(e) {
        console.error('Loader error:', e);
      }
    })();
  </script>
</body>
